# task and env
env:
  env_name: TwoCarrierEnv-v1
  num_envs: 8

# collector
collector:
  frames_per_batch: 8192
  total_frames: 8192000
  num_workers: 4

# logger
logger:
  backend: swanlab
  project_name: new_obs_vec_occt
  group_name: null
  exp_name: v2.1(2048steps)
  test_interval: 81920
  num_test_episodes: 4
  video: False
  log_interval: 2048
  save_train_metrics: True

# Optim
optim:
  lr: 1e-4
  weight_decay: 0.0
  anneal_lr: True
  device:

# loss
loss:
  gamma: 0.99
  mini_batch_size: 256
  ppo_epochs: 10
  gae_lambda: 0.95
  clip_epsilon: 0.2
  anneal_clip_epsilon: False
  critic_coeff: 0.5
  entropy_coeff: 0.01
  loss_critic_type: l2

compile:
  compile: False
  compile_mode:
  cudagraphs: False

checkpoint:
  save_interval: 81920
  keep_interval: 512_00
  checkpoint_dir: ./checkpoints_occt/
  load_path: null
  # /home/yons/Graduation/rl/occt/outputs/2026-02-07/18-33-45/checkpoints_occt/checkpoint_8192000_frames.pt 1024steps的优秀版本地址
